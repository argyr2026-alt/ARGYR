<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5046E5">
<title>ARGYR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: columna de app de 600px, tarjeta índigo arriba, contenido en tarjetas blancas, barra inferior fija con botón + central. */
:root{
  --bg:#F4F5FB;--surface:#FFFFFF;--surface-2:#EEF0FA;--ink:#171A3A;--muted:#62678C;--line:#E2E5F3;
  --accent:#5046E5;--accent-ink:#FFFFFF;--accent-soft:#E8E6FF;--hero-a:#5B4FE9;--hero-b:#4338CA;
  --ok:#0F7B54;--ok-soft:#DDF4EA;--warn:#8F5600;--warn-soft:#FDEFD2;--bad:#B4273A;--bad-soft:#FBE3E6;--gray-soft:#E9EAF3;
  --c-gasto:#C95A2E;--shadow:0 1px 2px rgba(23,26,58,.06),0 6px 20px rgba(23,26,58,.06);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--f-body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0F1F;--surface:#181A32;--surface-2:#20233F;--ink:#ECEDFA;--muted:#9A9FC6;--line:#2A2D4D;
  --accent:#8F88FF;--accent-ink:#0E0F1F;--accent-soft:#2B2862;--hero-a:#4E43D8;--hero-b:#352CA8;
  --ok:#4FD1A0;--ok-soft:#12382B;--warn:#F2B84B;--warn-soft:#3A2E12;--bad:#FF7D8F;--bad-soft:#3E1B22;--gray-soft:#272A47;
  --c-gasto:#FF9566;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F1F;--surface:#181A32;--surface-2:#20233F;--ink:#ECEDFA;--muted:#9A9FC6;--line:#2A2D4D;
  --accent:#8F88FF;--accent-ink:#0E0F1F;--accent-soft:#2B2862;--hero-a:#4E43D8;--hero-b:#352CA8;
  --ok:#4FD1A0;--ok-soft:#12382B;--warn:#F2B84B;--warn-soft:#3A2E12;--bad:#FF7D8F;--bad-soft:#3E1B22;--gray-soft:#272A47;
  --c-gasto:#FF9566;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:600px;margin:0 auto;padding-top:16px;min-width:0}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-display);letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.brand{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
.date{color:var(--muted);font-size:14px}
.icon-btn{width:40px;height:40px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.pill-btn{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:11px 18px;font-weight:700;display:inline-flex;gap:6px;align-items:center;box-shadow:0 6px 16px rgba(80,70,229,.3)}
.hero{background:linear-gradient(145deg,var(--hero-a),var(--hero-b));color:#fff;border-radius:24px;padding:20px;box-shadow:0 12px 28px rgba(67,56,202,.28);display:flex;flex-direction:column;gap:14px}
.hero .lbl{font-size:14px;opacity:.85}
.hero .big{font-size:40px;font-weight:800;line-height:1.05}
.hero .sub{font-size:13px;opacity:.8}
.accts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.acct{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 10px 9px;min-width:0}
.acct small{display:block;font-size:12px;opacity:.8}
.acct b{font-size:15px;display:block;overflow-wrap:anywhere}
.per{display:flex;gap:6px;flex-wrap:wrap}.per button{padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(255,255,255,.14);color:#fff}.per button[aria-pressed="true"]{background:#fff;color:#4338CA}
.seg{display:flex;background:rgba(255,255,255,.16);border-radius:18px;padding:4px;gap:2px}
.seg button{flex:1;padding:9px 6px;border-radius:14px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.85);min-width:0}
.seg button[aria-pressed="true"]{background:#fff;color:#4338CA}
.seg.light{background:var(--surface-2)}
.seg.light button{color:var(--muted)}
.seg.light button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card.tap{text-align:left;width:100%}
.card .k{color:var(--muted);font-size:13px;font-weight:600}
.card .v{font-size:24px;font-weight:800;margin:4px 0 2px;overflow-wrap:anywhere}
.card .s{color:var(--muted);font-size:13px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.sec h2{font-size:18px;font-weight:700}
.sec button,.link{color:var(--accent);font-weight:600;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-top:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip i{font-style:normal;font-size:12px;background:var(--gray-soft);color:var(--muted);border-radius:999px;padding:1px 7px}
.chip[aria-pressed="true"] i{background:var(--accent);color:var(--accent-ink)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);text-align:left;width:100%;min-width:0}
.ava{flex:none;width:42px;height:42px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px}
.ava.in{background:var(--ok-soft);color:var(--ok)}.ava.out{background:var(--bad-soft);color:var(--bad)}.ava.mv{background:var(--gray-soft);color:var(--muted)}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.item .amt{font-weight:800;font-size:16px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.tag{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.02em}
.tag.cobrada{background:var(--ok-soft);color:var(--ok)}.tag.pendiente{background:var(--warn-soft);color:var(--warn)}
.tag.cancelada{background:var(--gray-soft);color:var(--muted)}.tag.devuelta{background:var(--bad-soft);color:var(--bad)}.tag.parcial{background:var(--warn-soft);color:var(--warn)}
.day{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px;color:var(--muted);font-size:13px;font-weight:600}
.day b{color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lab{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;background:var(--surface-2);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;min-width:0}
.inp:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.search{display:flex;gap:8px;margin-top:6px}
.search .inp{flex:1}
.empty{text-align:center;color:var(--muted);padding:28px 12px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;margin-bottom:4px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--accent);border-radius:16px;padding:10px 14px;margin-bottom:12px;font-size:13.5px;font-weight:600}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner button{font-weight:700;text-decoration:underline;flex:none}
.nav{position:fixed;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px));pointer-events:none;z-index:20}
.nav-in{max-width:600px;margin:0 auto;background:var(--surface);border-radius:26px;box-shadow:0 10px 30px rgba(23,26,58,.18);border:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;padding:8px 6px;pointer-events:auto}
.nav button.t{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 0}
.nav button.t[aria-current="page"]{color:var(--accent)}
.nav .plus{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 8px 20px rgba(80,70,229,.4);border:4px solid var(--bg)}
svg{display:block}
.scrim{position:fixed;inset:0;background:rgba(10,10,30,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-size:21px;font-weight:800}
.sh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.form{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts .chip{padding:9px 13px}
.stepper{display:flex;align-items:center;background:var(--surface-2);border-radius:14px;overflow:hidden}
.stepper button{width:44px;height:46px;font-size:20px;color:var(--accent);font-weight:700}
.stepper input{flex:1;min-width:0;text-align:center;background:none;border:0;padding:12px 0;font-weight:700}
.stepper input:focus{outline:none}
.total{background:linear-gradient(145deg,var(--hero-a),var(--hero-b));color:#fff;border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.total b{font-size:28px;font-weight:800}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:0}
.btn{width:100%;padding:15px;border-radius:16px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btn.sec2{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns .btn{flex:1;min-width:130px;padding:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.hist{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
.bars .br{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;margin-bottom:12px;align-items:baseline}
.bars .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bars .fill{height:100%;border-radius:99px;background:var(--accent)}
.ind{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.delta{font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:99px;display:inline-block}
.delta.up{background:var(--ok-soft);color:var(--ok)}.delta.dn{background:var(--bad-soft);color:var(--bad)}.delta.eq{background:var(--gray-soft);color:var(--muted)}
.chart-wrap{overflow-x:auto}
.cap{color:var(--muted);font-size:13px;min-height:20px;margin-top:6px}
.cap b{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%}
.lock{position:fixed;inset:0;z-index:80;background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.lock h2{font-size:22px;text-align:center}.lock p{margin:0;opacity:.85;text-align:center;min-height:20px}
.dots{display:flex;gap:14px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}.dots i.on{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:26px;font-family:var(--f-display);font-weight:700}
.pad button.x{background:none;font-size:15px}
.lock .cancel{color:#fff;text-decoration:underline;font-weight:600}
.set{display:flex;flex-direction:column;gap:10px}
.set .btn{text-align:left;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;padding:14px 16px}
.hint{color:var(--muted);font-size:13px;margin:0}
@media (max-width:380px){.hero .big{font-size:34px}.accts{grid-template-columns:1fr}}

/* hoja con encabezado y pie fijos; solo el contenido del medio se desplaza */
.sheet{padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));max-height:92vh;max-height:92dvh;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet.noanim{animation:none}
.sheet::after{content:"";display:block;height:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.fx::after{display:none}
.sheet .sh-top{position:sticky;top:0;z-index:3;background:var(--bg);margin:0;padding:18px 0 12px}
.sh-foot{position:sticky;bottom:0;z-index:3;background:var(--bg);margin-top:14px;padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.sh-foot .total{padding:10px 14px}.sh-foot .total b{font-size:24px}
.sh-foot .err:empty{display:none}
.itm{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.itm-h{display:flex;justify-content:space-between;align-items:center}
.itm-sub{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:14px}
.itm-sub b{color:var(--ink)}
.its{gap:12px}.itl{display:flex;justify-content:space-between;gap:12px;align-items:baseline;color:var(--ink)}
.itl .mid{min-width:0;overflow-wrap:anywhere}.itl small{display:block;color:var(--muted);font-size:13px}

/* sin desplazamiento lateral: los campos de fecha de iOS/Android no pueden ensanchar la hoja */
html,body{overflow-x:hidden}
.sheet{overflow-x:hidden;touch-action:pan-y}
.sheet,.sheet .form,.sheet .field,.sheet .itm,.sheet .two,.scrim{min-width:0;max-width:100%}
input,select,textarea{max-width:100%;min-width:0}
input[type="date"],input[type="datetime-local"]{display:block;width:100%;min-width:0;-webkit-appearance:none;appearance:none;text-align:left;min-height:46px;line-height:1.2}
input[type="date"]::-webkit-date-and-time-value,input[type="datetime-local"]::-webkit-date-and-time-value{text-align:left;min-width:0}

.cbw{position:relative}
.cb{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 30px rgba(0,0,0,.28);max-height:min(250px,36vh);overflow-y:auto;overscroll-behavior:contain;padding:6px}
.cb button{display:block;width:100%;text-align:left;padding:12px;border-radius:10px;font-weight:600}
.cb button:hover,.cb button:active{background:var(--accent-soft);color:var(--accent)}
.cb .cb-use{color:var(--accent);background:var(--accent-soft)}
.cb-h{font-size:12px;color:var(--muted);font-weight:700;padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.06em}
.vars{display:flex;gap:8px;flex-wrap:wrap}

html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}[hidden]{display:none!important}
.auth{gap:12px;width:100%;max-width:340px}
.auth input{width:100%;padding:14px;border-radius:14px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:16px}
.auth input::placeholder{color:rgba(255,255,255,.7)}
.auth input:focus{outline:2px solid #fff}
.auth .btn{background:#fff;color:#4338CA}
</style>
</head>
<body><div class="app" id="app"></div>
<div class="nav" id="nav"></div>
<div id="layer"></div>
<div id="lockbox"></div>
<div id="authbox"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
